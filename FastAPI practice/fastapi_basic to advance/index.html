<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastAPI + React CORS Test</title>
  <!-- React and ReactDOM from CDN (No npm installation required) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel compiler to interpret JSX syntax in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="background-color: #f4f6f8; margin: 0; padding: 20px;">
  <div id="root"></div>

  <!-- React JSX Code -->
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [responseMsg, setResponseMsg] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const BACKEND_URL = "http://127.0.0.1:8000";

      // Function to fetch data from FastAPI backend
      const testCorsConnection = async (endpoint = "/") => {
        setLoading(true);
        setError(null);
        setResponseMsg(null);

        try {
          // Make HTTP GET request from Frontend (port 5173 / 3000 / 5500) to Backend (port 8000)
          const response = await fetch(`${BACKEND_URL}${endpoint}`);
          
          if (!response.ok) {
            throw new Error(`HTTP Error Status: ${response.status}`);
          }

          const data = await response.json();
          setResponseMsg(data);
        } catch (err) {
          console.error("CORS Error:", err);
          setError(err.message || "Failed to fetch from backend. Ensure FastAPI is running and CORS is enabled.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{
          maxWidth: '650px',
          margin: '40px auto',
          background: '#ffffff',
          padding: '30px',
          borderRadius: '16px',
          boxShadow: '0 8px 30px rgba(0, 0, 0, 0.08)',
          fontFamily: 'system-ui, -apple-system, sans-serif'
        }}>
          <h2 style={{ margin: '0 0 8px 0', color: '#009688' }}>🚀 FastAPI + React CORS Tester</h2>
          <p style={{ color: '#666', fontSize: '14px', margin: '0 0 20px 0' }}>
            Testing Cross-Origin Resource Sharing between Frontend and Backend (<code>{BACKEND_URL}</code>).
          </p>

          <div style={{ display: 'flex', gap: '12px', marginBottom: '24px' }}>
            <button
              onClick={() => testCorsConnection("/")}
              disabled={loading}
              style={{
                backgroundColor: '#009688',
                color: '#fff',
                border: 'none',
                padding: '12px 20px',
                borderRadius: '8px',
                cursor: loading ? 'not-allowed' : 'pointer',
                fontWeight: '600',
                fontSize: '14px'
              }}
            >
              {loading ? 'Testing...' : '1. Test GET / (Home)'}
            </button>

            <button
              onClick={() => testCorsConnection("/api/data")}
              disabled={loading}
              style={{
                backgroundColor: '#1976d2',
                color: '#fff',
                border: 'none',
                padding: '12px 20px',
                borderRadius: '8px',
                cursor: loading ? 'not-allowed' : 'pointer',
                fontWeight: '600',
                fontSize: '14px'
              }}
            >
              {loading ? 'Testing...' : '2. Test GET /api/data'}
            </button>
          </div>

          {/* Success Result Display */}
          {responseMsg && (
            <div style={{
              background: '#e8f5e9',
              border: '1px solid #a5d6a7',
              borderRadius: '8px',
              padding: '16px',
              color: '#1b5e20'
            }}>
              <h4 style={{ margin: '0 0 8px 0' }}>✅ CORS Success! Data Received:</h4>
              <pre style={{
                background: '#ffffff',
                padding: '12px',
                borderRadius: '6px',
                fontSize: '14px',
                margin: 0,
                overflowX: 'auto'
              }}>
                {JSON.stringify(responseMsg, null, 2)}
              </pre>
            </div>
          )}

          {/* Error Display */}
          {error && (
            <div style={{
              background: '#ffebee',
              border: '1px solid #ef9a9a',
              borderRadius: '8px',
              padding: '16px',
              color: '#b71c1c'
            }}>
              <h4 style={{ margin: '0 0 8px 0' }}>❌ CORS or Connection Error:</h4>
              <p style={{ margin: 0, fontSize: '14px' }}>{error}</p>
            </div>
          )}
        </div>
      );
    }

    // Render the React App into the DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
